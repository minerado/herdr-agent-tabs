id = "herdr-agent-tabs"
name = "Herdr Agent Tabs"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Name each agent tab after its status and topic (◐ fix login bug), and publish the topic as the $topic sidebar token. Tabs you rename by hand are left alone."
platforms = ["linux", "macos"]

# Every event runs the same idempotent pass. herdr fires no event when an
# agent retitles its terminal, so status and focus changes are what pick up a
# new topic.
[[startup]]
command = ["bash", "agent-tabs.sh", "startup"]

[[events]]
on = "tab.created"
command = ["bash", "agent-tabs.sh", "tab.created"]

[[events]]
on = "tab.closed"
command = ["bash", "agent-tabs.sh", "tab.closed"]

[[events]]
on = "tab.renamed"
command = ["bash", "agent-tabs.sh", "tab.renamed"]

[[events]]
on = "tab.focused"
command = ["bash", "agent-tabs.sh", "tab.focused"]

[[events]]
on = "pane.focused"
command = ["bash", "agent-tabs.sh", "pane.focused"]

[[events]]
on = "pane.created"
command = ["bash", "agent-tabs.sh", "pane.created"]

[[events]]
on = "pane.closed"
command = ["bash", "agent-tabs.sh", "pane.closed"]

[[events]]
on = "pane.exited"
command = ["bash", "agent-tabs.sh", "pane.exited"]

[[events]]
on = "pane.moved"
command = ["bash", "agent-tabs.sh", "pane.moved"]

[[events]]
on = "pane.agent_detected"
command = ["bash", "agent-tabs.sh", "pane.agent_detected"]

[[events]]
on = "pane.agent_status_changed"
command = ["bash", "agent-tabs.sh", "pane.agent_status_changed"]

# Hand a tab you renamed back to automatic naming:
#   herdr plugin action invoke herdr-agent-tabs.reset
[[actions]]
id = "reset"
title = "Agent Tabs: name this tab automatically again"
contexts = ["global"]
command = ["bash", "agent-tabs.sh", "reset"]
